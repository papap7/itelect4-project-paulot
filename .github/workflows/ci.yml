name: CI

on: push

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # Install exactly the versions pinned in package-lock.json.
      - run: npm ci

      - run: npm run lint

      # VITE_API_URL is provided by vite.config.ts; no secrets are required.
      - run: npm test

      # Type-checks src/ (including test files), then builds.
      - run: npm run build
